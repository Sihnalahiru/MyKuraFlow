name: Deploy MyKuraFlow API
on:
  push:
    branches: [main]
    paths:
      - "api-worker/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker syntax
        run: node --check api-worker/src/index.js
      - name: Check Cloudflare deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$D1_DATABASE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials or D1_DATABASE_ID are not configured; API deployment is intentionally skipped."
          fi
      - name: Install Wrangler
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-save wrangler
        working-directory: api-worker
      - name: Inject D1 database ID
        if: steps.credentials.outputs.ready == 'true'
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/g" wrangler.toml
        working-directory: api-worker
      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply mykuraflow-db --remote
        working-directory: api-worker
      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: api-worker
