<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="1200" height="580" fill="#fff7ed"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#9a3412">HEATSTROKE — PREVENTION &amp; EARLY WARNING</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="130" width="320" height="300" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="215" y="195" font-size="32" font-weight="bold" fill="#1e40af">HYDRATE</text><path d="M190 235 Q155 285 190 315 Q225 285 190 235" fill="#38bdf8" stroke="#0369a1" stroke-width="4"/><text x="215" y="370" font-size="24" fill="#1e3a8a">Drink water often</text><text x="215" y="405" font-size="20" fill="#1e3a8a">even before thirsty</text><rect x="440" y="130" width="320" height="300" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="195" font-size="32" font-weight="bold" fill="#166534">KEEP PPE ON</text><path d="M540 285 Q600 215 660 285 L650 315 H550z" fill="#facc15" stroke="#854d0e" stroke-width="4"/><text x="600" y="370" font-size="24" fill="#14532d">Workwear + helmet</text><text x="600" y="405" font-size="20" fill="#14532d">do not remove</text><rect x="825" y="130" width="320" height="300" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="985" y="195" font-size="32" font-weight="bold" fill="#991b1b">WARNING</text><text x="985" y="270" font-size="25" fill="#7f1d1d">Heavy sweating</text><text x="985" y="315" font-size="25" fill="#7f1d1d">Feeling unwell</text><text x="985" y="370" font-size="22" font-weight="bold" fill="#991b1b">STOP WORK → FIRST AID</text><text x="600" y="510" font-size="24" fill="#7c2d12">Use cooling / rest areas and follow workplace heat-safety procedures.</text></g></svg>