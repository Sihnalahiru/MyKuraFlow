<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">LOADING, UNLOADING &amp; STACKING — SAFETY CHECK</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="105" width="535" height="440" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><rect x="620" y="105" width="535" height="440" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/><text x="310" y="155" font-size="29" font-weight="bold" fill="#1e40af">LOADING / UNLOADING</text><text x="890" y="155" font-size="29" font-weight="bold" fill="#166534">STACKING / STORAGE</text><g font-size="22" fill="#1e3a8a"><text x="90" y="220" text-anchor="start">1. Coordinate with truck driver</text><text x="90" y="270" text-anchor="start">2. Check safety shoes and helmet</text><text x="90" y="320" text-anchor="start">3. Match equipment to cargo shape/weight</text><text x="90" y="370" text-anchor="start">4. Check load stability before lowering</text><text x="90" y="420" text-anchor="start">5. Use extra forklift for long loads if needed</text><text x="90" y="470" text-anchor="start">6. Keep communication during operation</text></g><g font-size="22" fill="#14532d"><text x="665" y="220" text-anchor="start">1. Match stack height to package strength</text><text x="665" y="270" text-anchor="start">2. Do not stack excessively high</text><text x="665" y="320" text-anchor="start">3. Use portable racks / pallet supports</text><text x="665" y="370" text-anchor="start">4. Check floor load capacity</text><text x="665" y="420" text-anchor="start">5. Insert forks to suitable depth</text><text x="665" y="470" text-anchor="start">6. Restack unstable cargo before work</text></g><text x="600" y="595" font-size="24" fill="#334155">Keep people clear of falling-load zones • never exceed floor or forklift capacity</text></g></svg>