<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">HAZARDOUS GOODS — SAFE HANDLING CHECKLIST</text><g font-family="Arial"><g><rect x="55" y="110" width="470" height="200" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="290" y="155" text-anchor="middle" font-size="27" font-weight="bold" fill="#991b1b">BEFORE HANDLING</text><text x="95" y="210" font-size="23" fill="#334155">1. Read GHS pictograms / label</text><text x="95" y="255" font-size="23" fill="#334155">2. Understand substance + hazards</text><rect x="575" y="110" width="470" height="200" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="810" y="155" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e40af">PROTECT YOURSELF</text><text x="615" y="210" font-size="23" fill="#334155">3. Wear gloves, mask, goggles</text><text x="615" y="255" font-size="23" fill="#334155">4. Check leaks / possible splashes</text><rect x="55" y="355" width="470" height="200" rx="18" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="290" y="400" text-anchor="middle" font-size="27" font-weight="bold" fill="#92400e">AVOID IGNITION / DAMAGE</text><text x="95" y="455" font-size="23" fill="#334155">5. Keep away from fire and heat</text><text x="95" y="500" font-size="23" fill="#334155">6. Avoid friction / impact / breakage</text><rect x="575" y="355" width="470" height="200" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="810" y="400" text-anchor="middle" font-size="27" font-weight="bold" fill="#166534">BE READY FOR EMERGENCIES</text><text x="615" y="455" font-size="23" fill="#334155">7. Know emergency response steps</text><text x="615" y="500" font-size="23" fill="#334155">8. Prepare spill-control equipment</text><text x="550" y="610" text-anchor="middle" font-size="22" fill="#475569">Never handle hazardous / harmful materials without required protective equipment.</text></g></svg>