<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">CONTAINER WORK &amp; CONVEYOR SAFETY</text><g font-family="Arial"><rect x="45" y="105" width="530" height="440" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><rect x="625" y="105" width="530" height="440" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="310" y="155" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e40af">CONTAINER OPERATIONS</text><text x="890" y="155" text-anchor="middle" font-size="30" font-weight="bold" fill="#9a3412">BELT CONVEYOR</text><g fill="#1e3a8a" font-size="23"><text x="85" y="225">1. Vanning: balance cargo weight</text><text x="85" y="275">2. Secure with lashing / shoring</text><text x="85" y="325">3. Devanning: open one door at a time</text><text x="85" y="375">4. Check for shifted / fallen cargo</text><text x="85" y="425">5. Report collapse risk immediately</text><text x="85" y="475">6. Secure doors against movement</text></g><g fill="#7c2d12" font-size="23"><text x="665" y="225">1. Switch power OFF before moving</text><text x="665" y="275">2. For linked conveyors, appoint</text><text x="690" y="310">one work leader</text><text x="665" y="375">3. Coordinate and direct the team</text><text x="665" y="425">4. Fit an emergency-stop button</text><text x="665" y="475">5. Know the emergency stop location</text></g><g transform="translate(795 505)"><rect x="0" y="0" width="190" height="18" rx="9" fill="#475569"/><circle cx="30" cy="9" r="24" fill="#334155"/><circle cx="160" cy="9" r="24" fill="#334155"/><rect x="75" y="-38" width="40" height="36" rx="8" fill="#dc2626"/><text x="95" y="-15" text-anchor="middle" font-size="16" fill="white">STOP</text></g><text x="600" y="600" font-size="22" fill="#334155" text-anchor="middle">Never open unstable container doors suddenly • isolate power before moving equipment</text></g></svg>