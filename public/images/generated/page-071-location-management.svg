<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">THREE WAREHOUSE LOCATION METHODS</text><g font-family="Arial"><rect x="50" y="110" width="350" height="380" rx="18" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="225" y="160" text-anchor="middle" font-size="29" font-weight="bold" fill="#1d4ed8">FIXED</text><g fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"><rect x="95" y="200" width="110" height="90"/><rect x="235" y="200" width="110" height="90"/><rect x="95" y="315" width="110" height="90"/><rect x="235" y="315" width="110" height="90"/></g><text x="225" y="450" text-anchor="middle" font-size="22" fill="#334155">Same SKU → same slot</text><rect x="425" y="110" width="350" height="380" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="600" y="160" text-anchor="middle" font-size="29" font-weight="bold" fill="#15803d">FREE</text><g fill="#bbf7d0" stroke="#15803d" stroke-width="2"><rect x="470" y="200" width="110" height="90"/><rect x="610" y="200" width="110" height="90"/><rect x="470" y="315" width="110" height="90"/><rect x="610" y="315" width="110" height="90"/></g><text x="600" y="450" text-anchor="middle" font-size="22" fill="#334155">Any available slot</text><rect x="800" y="110" width="350" height="380" rx="18" fill="#fff" stroke="#d97706" stroke-width="4"/><text x="975" y="160" text-anchor="middle" font-size="29" font-weight="bold" fill="#92400e">DOUBLE</text><rect x="850" y="200" width="120" height="205" fill="#fde68a" stroke="#d97706" stroke-width="3"/><rect x="990" y="200" width="120" height="205" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><text x="910" y="290" text-anchor="middle" font-size="21" fill="#78350f">Pick</text><text x="1050" y="290" text-anchor="middle" font-size="21" fill="#7c2d12">Stock</text><path d="M990 370 H970" stroke="#7c2d12" stroke-width="6"/><text x="975" y="450" text-anchor="middle" font-size="22" fill="#334155">Fixed pick + free reserve</text><rect x="50" y="530" width="1100" height="130" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="85" y="585" font-size="26" fill="#172554">FIFO • Separate damaged goods • Keep aisles clear • Label split locations</text><text x="85" y="625" font-size="24" fill="#475569">Sashifuda = stock card for cargo details and in/out records</text></g></svg>