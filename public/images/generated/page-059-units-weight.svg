<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="50" y="65" font-size="38" font-family="Arial" font-weight="bold" fill="#172554">CAPACITY &amp; WEIGHT CONVERSIONS</text><g font-family="Arial" font-size="27"><rect x="55" y="115" width="500" height="205" rx="18" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="85" y="165" font-weight="bold" fill="#1d4ed8">JAPANESE CAPACITY</text><text x="100" y="220" fill="#334155">1 Gou = 0.18 L</text><text x="100" y="265" fill="#334155">1 Shou = 1.8 L = 10 Gou</text><text x="100" y="305" fill="#334155">1 To = 18 L = 10 Shou</text><rect x="625" y="115" width="520" height="205" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="655" y="165" font-weight="bold" fill="#15803d">MASS</text><text x="690" y="220" fill="#334155">1 t = 1,000 kg</text><text x="690" y="265" fill="#334155">1 kg = 1,000 g</text><text x="690" y="305" fill="#334155">1 L water ≈ 1 kg</text><rect x="55" y="365" width="1090" height="190" rx="18" fill="#fff" stroke="#d97706" stroke-width="4"/><text x="85" y="415" font-weight="bold" fill="#92400e">SPECIFIC-GRAVITY EXAMPLE</text><text x="100" y="475" fill="#172554" font-size="38">0.5 m³ × 0.9 = 0.45 t = 450 kg</text><text x="100" y="525" fill="#475569" font-size="23">1 lb = 453.6 g • 1 oz ≈ 28 g • 1 kan ≈ 3.75 kg</text></g></svg>