<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">DAILY HEALTH CHECK — WHEN YOU FEEL UNWELL</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="135" width="250" height="200" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="180" y="205" font-size="30" font-weight="bold" fill="#991b1b">FEVER /</text><text x="180" y="245" font-size="30" font-weight="bold" fill="#991b1b">UNWELL</text><path d="M310 235 H390" stroke="#475569" stroke-width="8"/><path d="M370 215 L395 235 L370 255" stroke="#475569" stroke-width="8" fill="none"/><rect x="405" y="135" width="220" height="200" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="515" y="220" font-size="28" font-weight="bold" fill="#1e40af">1. NOTIFY</text><text x="515" y="265" font-size="22" fill="#1e3a8a">the company</text><path d="M630 235 H700" stroke="#475569" stroke-width="8"/><path d="M680 215 L705 235 L680 255" stroke="#475569" stroke-width="8" fill="none"/><rect x="715" y="135" width="200" height="200" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="815" y="220" font-size="28" font-weight="bold" fill="#166534">2. REST</text><text x="815" y="265" font-size="22" fill="#14532d">in your room</text><path d="M920 235 H980" stroke="#475569" stroke-width="8"/><path d="M960 215 L985 235 L960 255" stroke="#475569" stroke-width="8" fill="none"/><rect x="995" y="135" width="160" height="200" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="1075" y="220" font-size="25" font-weight="bold" fill="#92400e">3. CLINIC</text><text x="1075" y="265" font-size="20" fill="#78350f">if needed</text><rect x="100" y="395" width="1000" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="600" y="455" font-size="27" font-weight="bold" fill="#075985">Before each shift: regular meals • hydration • warm-up exercises</text></g></svg>