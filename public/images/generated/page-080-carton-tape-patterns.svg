<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">CARTON TAPE PATTERNS — SOURCE STRENGTH ORDER</text><g font-family="Arial" text-anchor="middle"><g fill="#d6a56f" stroke="#78350f" stroke-width="3"><rect x="55" y="160" width="240" height="170" rx="10"/><rect x="345" y="160" width="240" height="170" rx="10"/><rect x="635" y="160" width="240" height="170" rx="10"/><rect x="925" y="160" width="240" height="170" rx="10"/></g><g stroke="#92400e" stroke-width="18"><path d="M175 160 V330"/><path d="M465 160 V330 M345 245 H585"/><path d="M755 160 V330 M635 245 H875 M635 200 H875"/><path d="M1045 160 V330 M925 245 H1165 M925 200 H1165 M1045 160 L925 330 M1045 160 L1165 330"/></g><g font-family="Arial" fill="#172554" font-size="25" font-weight="bold"><text x="175" y="390">I / 一の字 ★</text><text x="465" y="390">CROSS / 十 ★★</text><text x="755" y="390">K / キ ★★★</text><text x="1045" y="390">米 ★★★★</text></g><rect x="60" y="445" width="1080" height="110" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="600" y="490" font-size="25" fill="#1e3a8a">H-taping seals corners to keep dust out</text><text x="600" y="530" font-size="21" fill="#334155">Source note: H pattern prevents dust ingress; it is not described as a strength increase.</text></g></svg>