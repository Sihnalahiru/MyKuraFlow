<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">OUTBOUND DOUBLE-CHECK &amp; DAMAGE RESPONSE</text><rect x="55" y="110" width="1090" height="235" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="90" y="160" font-family="Arial" font-size="28" font-weight="bold" fill="#1d4ed8">DOUBLE-CHECK LIST</text><g font-family="Arial" font-size="25" fill="#334155"><text x="100" y="220">□ Product name  □ Marks  □ Quantity</text><text x="100" y="275">□ Packaging  □ Destination  □ Consignment</text><text x="700" y="220">□ LOT / dates / serial</text><text x="700" y="275">□ Damage / moisture / pests</text></g><rect x="55" y="385" width="520" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="90" y="435" font-family="Arial" font-size="27" font-weight="bold" fill="#991b1b">DAMAGE CAUSES</text><g font-family="Arial" font-size="23" fill="#7f1d1d"><text x="100" y="490">• Human error</text><text x="100" y="535">• Temperature / vibration / impact</text><text x="100" y="580">• Weak or unsuitable packaging</text><text x="100" y="615">• Physical / chemical product change</text></g><rect x="625" y="385" width="520" height="250" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="660" y="435" font-family="Arial" font-size="27" font-weight="bold" fill="#166534">RESPONSE</text><g font-family="Arial" font-size="23" fill="#14532d"><text x="670" y="490">1. Contact depositor</text><text x="670" y="535">2. Follow their instructions</text><text x="670" y="580">3. If unavailable, separate LOT</text><text x="670" y="615">4. Follow prior agreement</text></g></svg>