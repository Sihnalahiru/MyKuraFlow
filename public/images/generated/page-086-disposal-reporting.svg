<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f8fafc"/><text x="40" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">DISPOSAL &amp; ISSUE REPORTING</text><rect x="65" y="130" width="330" height="240" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="230" y="195" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#166534">REUSE / RECYCLE</text><text x="230" y="255" text-anchor="middle" font-family="Arial" font-size="23" fill="#14532d">Follow designated</text><text x="230" y="295" text-anchor="middle" font-family="Arial" font-size="23" fill="#14532d">collection rules</text><rect x="435" y="130" width="330" height="240" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="600" y="195" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#92400e">DISPOSAL</text><text x="600" y="255" text-anchor="middle" font-family="Arial" font-size="23" fill="#78350f">Unneeded items</text><text x="600" y="295" text-anchor="middle" font-family="Arial" font-size="23" fill="#78350f">→ approved method</text><rect x="805" y="130" width="330" height="240" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="970" y="195" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#991b1b">REPORT</text><text x="970" y="255" text-anchor="middle" font-family="Arial" font-size="23" fill="#7f1d1d">Any issue found</text><text x="970" y="295" text-anchor="middle" font-family="Arial" font-size="23" fill="#7f1d1d">throughout process</text><text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="24" fill="#334155">Never leave unidentified waste or unresolved problems in the work area.</text></svg>