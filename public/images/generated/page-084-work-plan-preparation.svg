<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">WORK PLAN &amp; PREPARATION CHECKLIST</text><g font-family="Arial"><rect x="55" y="120" width="520" height="410" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="315" y="170" text-anchor="middle" font-size="28" font-weight="bold" fill="#1d4ed8">PLAN THESE FIVE ITEMS</text><g font-size="25" fill="#334155"><text x="105" y="235">1. Work content — WHAT</text><text x="105" y="295">2. Procedure — IN WHAT ORDER</text><text x="105" y="355">3. Staffing — HOW MANY</text><text x="105" y="415">4. Materials — WHAT SUPPLIES</text><text x="105" y="475">5. Tools / equipment — WHICH</text></g><rect x="625" y="120" width="520" height="410" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="885" y="170" text-anchor="middle" font-size="28" font-weight="bold" fill="#166534">PRE-START</text><g font-size="24" fill="#14532d"><text x="675" y="235">□ Secure work zone + signs</text><text x="675" y="295">□ Bring instructed products</text><text x="675" y="355">□ Check material quantities</text><text x="675" y="415">□ Prepare table / gloves / cutter / tape</text><text x="675" y="475">□ Remove unnecessary items</text></g><text x="600" y="590" text-anchor="middle" font-size="24" fill="#475569">Calculate staffing and time from hourly work capacity; follow workplace rules.</text></g></svg>