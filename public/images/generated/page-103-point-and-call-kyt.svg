<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">KYT 4R + POINT-AND-CALL</text><g font-family="Arial" text-anchor="middle"><g><rect x="55" y="110" width="450" height="85" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="280" y="145" font-size="24" font-weight="bold" fill="#1e40af">1R — FIND HIDDEN HAZARDS</text><text x="280" y="175" font-size="18" fill="#1e3a8a">Share what could go wrong</text><rect x="595" y="110" width="450" height="85" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="820" y="145" font-size="24" font-weight="bold" fill="#3730a3">2R — IDENTIFY KEY DANGER</text><text x="820" y="175" font-size="18" fill="#312e81">Select the most important risk</text><rect x="55" y="245" width="450" height="85" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="280" y="280" font-size="24" font-weight="bold" fill="#92400e">3R — WHAT WOULD YOU DO?</text><text x="280" y="310" font-size="18" fill="#78350f">Discuss practical countermeasures</text><rect x="595" y="245" width="450" height="85" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="820" y="280" font-size="24" font-weight="bold" fill="#166534">4R — AGREE THE ACTION</text><text x="820" y="310" font-size="18" fill="#14532d">Set team action target and confirm</text></g><rect x="130" y="390" width="840" height="150" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="550" y="435" font-size="27" font-weight="bold" fill="#172554">POINT • LOOK • SAY ALOUD</text><text x="550" y="480" font-size="24" fill="#334155">“Right — OK! Left — OK! Ahead — OK!”</text><text x="550" y="515" font-size="19" fill="#475569">Source textbook reports error rates: 2.38% → 1.00% → 0.75% → 0.38%</text></g></svg>