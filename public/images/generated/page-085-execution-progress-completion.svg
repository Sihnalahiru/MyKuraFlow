<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">EXECUTION → PROGRESS → COMPLETION</text><g font-family="Arial"><rect x="55" y="125" width="320" height="410" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="215" y="180" text-anchor="middle" font-size="29" font-weight="bold" fill="#1d4ed8">EXECUTE</text><text x="95" y="245" font-size="23" fill="#334155">• Follow process sheet</text><text x="95" y="300" font-size="23" fill="#334155">• Count in 20 / 50 batches</text><text x="95" y="355" font-size="23" fill="#334155">• Match goods and materials</text><text x="95" y="410" font-size="23" fill="#b91c1c">• Report damage / tool fault</text><rect x="440" y="125" width="320" height="410" rx="18" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="600" y="180" text-anchor="middle" font-size="29" font-weight="bold" fill="#92400e">MONITOR</text><text x="480" y="245" font-size="23" fill="#334155">• Check progress continuously</text><text x="480" y="300" font-size="23" fill="#334155">• Report delays / defects</text><text x="480" y="355" font-size="23" fill="#334155">• Store daily completed goods</text><text x="480" y="410" font-size="23" fill="#334155">• Use assigned locations</text><rect x="825" y="125" width="320" height="410" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="985" y="180" text-anchor="middle" font-size="29" font-weight="bold" fill="#166534">COMPLETE</text><text x="865" y="245" font-size="23" fill="#334155">• Count good / defective</text><text x="865" y="300" font-size="23" fill="#334155">• Separate and hand over</text><text x="865" y="355" font-size="23" fill="#334155">• Reconcile tools / materials</text><text x="865" y="410" font-size="23" fill="#334155">• Recycle / dispose correctly</text><path d="M375 325 H430 M760 325 H815" stroke="#475569" stroke-width="7"/><path d="M415 305 L435 325 L415 345 M800 305 L820 325 L800 345" stroke="#475569" stroke-width="6" fill="none"/></g></svg>