<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">CUSHIONING • SAFE OPENING • PP BANDS</text><rect x="50" y="110" width="530" height="440" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="315" y="160" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#1d4ed8">CUSHION MATERIALS</text><g font-family="Arial" font-size="23" fill="#334155"><text x="100" y="225">• Paper cushioning / paper packing</text><text x="100" y="280">• Air cushion / air pillows</text><text x="100" y="335">• Bubble wrap (air-cap)</text><text x="100" y="390">• Lightweight foam</text><text x="100" y="475">Fill gaps around the product</text></g><rect x="620" y="110" width="530" height="440" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="885" y="160" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#b91c1c">SAFE CARTON OPENING</text><rect x="760" y="220" width="250" height="160" fill="#d6a56f" stroke="#78350f" stroke-width="4"/><path d="M780 240 L900 210 L920 230 L800 260" fill="#94a3b8" stroke="#475569" stroke-width="3"/><path d="M900 210 L850 290" stroke="#dc2626" stroke-width="7"/><text x="885" y="430" text-anchor="middle" font-family="Arial" font-size="23" fill="#991b1b">Shallow cut — never insert blade deeply</text><text x="885" y="480" text-anchor="middle" font-family="Arial" font-size="22" fill="#334155">Broken blade → notify → search → account for fragment</text></svg>