<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">FORKLIFT TRAVEL — SAFE LOAD POSITION</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="100" width="530" height="420" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><rect x="625" y="100" width="530" height="420" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="310" y="150" font-size="30" font-weight="bold" fill="#166534">CORRECT</text><text x="890" y="150" font-size="30" font-weight="bold" fill="#991b1b">AVOID</text><g transform="translate(130 215)"><rect x="30" y="110" width="250" height="75" rx="20" fill="#f59e0b" stroke="#92400e" stroke-width="5"/><circle cx="85" cy="190" r="28" fill="#334155"/><circle cx="235" cy="190" r="28" fill="#334155"/><rect x="190" y="-5" width="22" height="120" fill="#475569"/><path d="M212 100 H330" stroke="#475569" stroke-width="10"/><rect x="220" y="35" width="110" height="65" fill="#c08457" stroke="#78350f" stroke-width="4"/><path d="M220 100 H340" stroke="#92400e" stroke-width="8"/><path d="M80 250 H350" stroke="#16a34a" stroke-width="6"/><text x="195" y="300" font-size="24" fill="#14532d">Pallet 15–20 cm above floor</text></g><g transform="translate(710 215)"><rect x="30" y="110" width="250" height="75" rx="20" fill="#f59e0b" stroke="#92400e" stroke-width="5"/><circle cx="85" cy="190" r="28" fill="#334155"/><circle cx="235" cy="190" r="28" fill="#334155"/><rect x="190" y="-90" width="22" height="205" fill="#475569"/><path d="M212 10 H330" stroke="#475569" stroke-width="10"/><rect x="220" y="-55" width="110" height="65" fill="#c08457" stroke="#78350f" stroke-width="4"/><path d="M220 10 H340" stroke="#92400e" stroke-width="8"/><path d="M80 250 H350" stroke="#dc2626" stroke-width="6"/><text x="195" y="300" font-size="24" fill="#991b1b">Do not travel with forks raised</text></g><text x="600" y="570" font-size="24" fill="#334155">Slow down when turning • check all directions • use reverse or a guide if the load blocks front visibility</text></g></svg>