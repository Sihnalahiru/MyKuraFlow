<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">DISPATCH HANDOVER &amp; ZERO LEFTOVER CARGO</text><g font-family="Arial"><rect x="55" y="125" width="245" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="177" y="180" text-anchor="middle" font-size="24" fill="#1e3a8a">Verify vehicle</text><text x="177" y="220" text-anchor="middle" font-size="22" fill="#1e3a8a">and collector</text><rect x="345" y="125" width="245" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="467" y="180" text-anchor="middle" font-size="24" fill="#166534">Check cargo</text><text x="467" y="220" text-anchor="middle" font-size="22" fill="#166534">with carrier</text><rect x="635" y="125" width="245" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="757" y="180" text-anchor="middle" font-size="24" fill="#92400e">Load &amp; inspect</text><text x="757" y="220" text-anchor="middle" font-size="22" fill="#92400e">cargo condition</text><rect x="925" y="125" width="220" height="150" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="1035" y="180" text-anchor="middle" font-size="24" fill="#9d174d">Sign receipt</text><text x="1035" y="220" text-anchor="middle" font-size="22" fill="#9d174d">final sweep</text><path d="M300 200 H335 M590 200 H625 M880 200 H915" stroke="#475569" stroke-width="6"/><rect x="55" y="345" width="1090" height="240" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="90" y="400" font-size="29" font-weight="bold" fill="#b91c1c">PREVENT ZANKA (LEFTOVER CARGO)</text><g font-size="25" fill="#334155"><text x="100" y="465">1. Count aloud together — avoid assumptions and miscounts</text><text x="100" y="515">2. Assign staff to check forgotten-cargo locations</text><text x="100" y="565">3. Keep warehouse tidy so uncollected goods stand out</text></g></g></svg>