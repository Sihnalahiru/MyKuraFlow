<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="50" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">INBOUND PREPARATION &amp; VEHICLE GUIDANCE</text><g font-family="Arial"><rect x="55" y="120" width="300" height="180" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="205" y="180" text-anchor="middle" font-size="27" fill="#1e3a8a">1. CHECK</text><text x="205" y="230" text-anchor="middle" font-size="23" fill="#334155">Inbound schedule</text><rect x="450" y="120" width="300" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="180" text-anchor="middle" font-size="27" fill="#166534">2. PREPARE</text><text x="600" y="230" text-anchor="middle" font-size="23" fill="#334155">Handling equipment</text><rect x="845" y="120" width="300" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="995" y="180" text-anchor="middle" font-size="27" fill="#92400e">3. CLEAR SPACE</text><text x="995" y="230" text-anchor="middle" font-size="23" fill="#334155">Relocate cargo if needed</text><path d="M365 210 H440 M760 210 H835" stroke="#475569" stroke-width="8"/><path d="M420 190 L445 210 L420 230 M815 190 L840 210 L815 230" fill="none" stroke="#475569" stroke-width="7"/><rect x="70" y="365" width="1060" height="220" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="105" y="415" font-size="28" font-weight="bold" fill="#172554">REFERENCE LOADING-DECK HEIGHTS (SOURCE)</text><text x="120" y="475" font-size="27" fill="#334155">Truck: 0.8–1.2 m</text><text x="470" y="475" font-size="27" fill="#334155">Trailer: 1.0–1.2 m</text><text x="850" y="475" font-size="27" fill="#334155">Container: about 1.2 m</text><text x="120" y="535" font-size="23" fill="#b91c1c">Open sea-container doors slowly; never force a jammed door.</text></g></svg>