<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">FORKLIFT LOAD PICK-UP — 8 SOURCE STEPS</text><g font-family="Arial"><g><rect x="45" y="105" width="535" height="125" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="75" y="150" font-size="25" font-weight="bold" fill="#1e40af">1. APPROACH SLOWLY</text><text x="75" y="190" font-size="21" fill="#1e3a8a">Reduce speed as you approach the cargo.</text><rect x="620" y="105" width="535" height="125" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/><text x="650" y="150" font-size="25" font-weight="bold" fill="#3730a3">2. STOP &amp; SET MAST VERTICAL</text><text x="650" y="190" font-size="21" fill="#312e81">Stop in front of load; align mast upright.</text><rect x="45" y="260" width="535" height="125" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="75" y="305" font-size="25" font-weight="bold" fill="#92400e">3. CHECK LOAD STABILITY</text><text x="75" y="345" font-size="21" fill="#78350f">Check for collapse risk and other hazards.</text><rect x="620" y="260" width="535" height="125" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="650" y="305" font-size="25" font-weight="bold" fill="#9a3412">4. ALIGN &amp; INSERT FORKS</text><text x="650" y="345" font-size="21" fill="#7c2d12">Align squarely; check fork pockets; insert gently.</text><rect x="45" y="415" width="535" height="125" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="75" y="460" font-size="25" font-weight="bold" fill="#166534">5. INITIAL LIFT &amp; REPOSITION</text><text x="75" y="500" font-size="21" fill="#14532d">Lift 5–10 cm; draw 10–20 cm toward you; lower, then fully insert.</text><rect x="620" y="415" width="535" height="125" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="650" y="460" font-size="25" font-weight="bold" fill="#155e75">6. RETREAT &amp; TILT BACK</text><text x="650" y="500" font-size="21" fill="#164e63">Reverse carefully; lower load 5–10 cm; tilt mast back.</text><rect x="45" y="570" width="535" height="125" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="75" y="615" font-size="25" font-weight="bold" fill="#6b21a8">7. PLACE AT DESTINATION</text><text x="75" y="655" font-size="21" fill="#581c87">Level mast, position pallet, lower gently; withdraw forks.</text><rect x="620" y="570" width="535" height="125" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="650" y="615" font-size="25" font-weight="bold" fill="#991b1b">8. CHECK HIGH-LEVEL PICK</text><text x="650" y="655" font-size="21" fill="#7f1d1d">Make sure people and nearby cargo are clear.</text></g></g></svg>