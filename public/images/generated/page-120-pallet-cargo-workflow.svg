<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="35" y="55" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">PALLET CARGO — SAFE WORK SEQUENCE</text><g font-family="Arial"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="40" y="100" width="350" height="150" rx="18"/><rect x="425" y="100" width="350" height="150" rx="18"/><rect x="810" y="100" width="350" height="150" rx="18"/><rect x="40" y="300" width="350" height="150" rx="18"/><rect x="425" y="300" width="350" height="150" rx="18"/><rect x="810" y="300" width="350" height="150" rx="18"/></g><g fill="#1e3a8a"><text x="65" y="145" font-size="26" font-weight="bold">1. MATCH THE FORKLIFT</text><text x="65" y="185" font-size="21">Capacity, load size and fork</text><text x="65" y="215" font-size="21">length must suit the cargo.</text><text x="450" y="145" font-size="26" font-weight="bold">2. SET FORK WIDTH</text><text x="450" y="185" font-size="21">Adjust spacing and approach</text><text x="450" y="215" font-size="21">squarely from the pallet front.</text><text x="835" y="145" font-size="26" font-weight="bold">3. INSERT FULLY</text><text x="835" y="185" font-size="21">Support the entire pallet;</text><text x="835" y="215" font-size="21">shallow insertion risks a fall.</text><text x="65" y="345" font-size="26" font-weight="bold">4. CHECK AFTER LIFT</text><text x="65" y="385" font-size="21">Check ground clearance and</text><text x="65" y="415" font-size="21">load centre before travelling.</text><text x="450" y="345" font-size="26" font-weight="bold">5. VISIBILITY &amp; FLOOR</text><text x="450" y="385" font-size="21">Reverse if vision is blocked;</text><text x="450" y="415" font-size="21">slow for slopes and obstacles.</text><text x="835" y="345" font-size="26" font-weight="bold">6. SLOPE PICK-UP</text><text x="835" y="385" font-size="21">Stop and adjust fork angle</text><text x="835" y="415" font-size="21">before inserting on a slope.</text></g><path d="M390 175 H420 M775 175 H805 M980 250 V290 M810 375 H780 M425 375 H395" stroke="#64748b" stroke-width="6" fill="none"/><text x="600" y="530" font-size="25" fill="#334155" text-anchor="middle">Follow warehouse speed limits • keep load stable • never rush on uneven floors</text><text x="600" y="575" font-size="20" fill="#64748b" text-anchor="middle">Visual summary based on source textbook page 120</text></g></svg>