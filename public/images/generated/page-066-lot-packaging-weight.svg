<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">LOT TRACEABILITY, PACKAGING UNITS &amp; WEIGHT RECORDS</text><rect x="55" y="105" width="1090" height="155" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="85" y="150" font-family="Arial" font-size="27" font-weight="bold" fill="#1d4ed8">SPLIT DELIVERY (KUCHIWARI)</text><g fill="#d6a56f" stroke="#78350f" stroke-width="3"><rect x="110" y="180" width="80" height="55"/><rect x="210" y="180" width="80" height="55"/><rect x="310" y="180" width="80" height="55" opacity=".35"/></g><text x="440" y="215" font-family="Arial" font-size="25" fill="#334155">2 arrive now • 1 arrives later → check partial delivery</text><rect x="55" y="290" width="1090" height="150" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="85" y="335" font-family="Arial" font-size="27" font-weight="bold" fill="#15803d">PACKAGING / MANAGEMENT HIERARCHY</text><g font-family="Arial" font-size="23" text-anchor="middle"><rect x="85" y="365" width="150" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="400" fill="#172554">Piece</text><rect x="290" y="365" width="150" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="365" y="400" fill="#172554">Ball</text><rect x="495" y="365" width="150" height="55" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="570" y="400" fill="#172554">Case</text><rect x="700" y="365" width="170" height="55" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="785" y="400" fill="#172554">Combined</text><rect x="925" y="365" width="150" height="55" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="1000" y="400" fill="#172554">Pallet</text></g><rect x="55" y="470" width="1090" height="235" rx="18" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="85" y="515" font-family="Arial" font-size="27" font-weight="bold" fill="#92400e">VARIABLE-WEIGHT METHODS</text><g font-family="Arial" font-size="23" fill="#334155"><text x="90" y="570">Kenkan — actual measured weight — record required</text><text x="90" y="615">Kiritsuke — labelled weight — record required</text><text x="90" y="660">Average — total weight ÷ quantity — no sheet required</text><text x="660" y="570">Deemed fixed — pre-set weight — no sheet required</text><text x="660" y="625">LOT numbers: separate batches by factory / date</text></g></svg>