<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f8fafc"/><text x="50" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">UNLOADING &amp; INBOUND INSPECTION</text><rect x="55" y="120" width="330" height="480" rx="18" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="220" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#1d4ed8">UNLOAD</text><text x="95" y="245" font-family="Arial" font-size="25" fill="#334155">• Open truck/container</text><text x="95" y="300" font-family="Arial" font-size="25" fill="#334155">• Remove cargo carefully</text><text x="95" y="355" font-family="Arial" font-size="25" fill="#334155">• Use forklift / trolley</text><text x="95" y="410" font-family="Arial" font-size="25" fill="#334155">• Follow handling marks</text><rect x="435" y="120" width="710" height="480" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="790" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#15803d">CHECK AGAINST DOCUMENTS</text><g font-family="Arial" font-size="25" fill="#334155"><text x="485" y="245">□ Product name</text><text x="485" y="295">□ Size / dimensions</text><text x="485" y="345">□ Marks / symbols</text><text x="485" y="395">□ Manufacturing LOT No.</text><text x="810" y="245">□ Colour</text><text x="810" y="295">□ Quantity</text><text x="810" y="345">□ Unit form</text><text x="810" y="395">□ Packaging form</text><text x="485" y="485" fill="#b91c1c">Barcode scan: use approved reader procedure</text><text x="485" y="535" fill="#b91c1c">Driver present during receiving inspection</text></g></svg>