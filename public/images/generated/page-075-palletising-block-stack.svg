<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">PALLETISING &amp; BLOCK STACKING</text><g font-family="Arial"><rect x="60" y="120" width="500" height="390" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="310" y="170" text-anchor="middle" font-size="29" font-weight="bold" fill="#1d4ed8">SAFE PALLET LOAD</text><rect x="150" y="390" width="320" height="40" fill="#b45309"/><g fill="#d6a56f" stroke="#78350f" stroke-width="3"><rect x="170" y="300" width="90" height="85"/><rect x="265" y="300" width="90" height="85"/><rect x="360" y="300" width="90" height="85"/><rect x="215" y="210" width="90" height="85"/><rect x="310" y="210" width="90" height="85"/></g><text x="310" y="465" text-anchor="middle" font-size="23" fill="#166534">No overhang</text><rect x="640" y="120" width="500" height="390" rx="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="890" y="170" text-anchor="middle" font-size="29" font-weight="bold" fill="#b91c1c">UNSAFE OVERHANG</text><rect x="730" y="390" width="320" height="40" fill="#b45309"/><g fill="#fca5a5" stroke="#991b1b" stroke-width="3"><rect x="700" y="300" width="130" height="85"/><rect x="835" y="300" width="130" height="85"/><rect x="970" y="300" width="130" height="85"/><rect x="755" y="210" width="130" height="85"/><rect x="890" y="210" width="130" height="85"/></g><text x="890" y="465" text-anchor="middle" font-size="23" fill="#b91c1c">Load extends beyond pallet</text><text x="600" y="570" text-anchor="middle" font-size="25" fill="#334155">Heavy / strong cartons at bottom • crushable bags on top • inspect pallet / nails / boards</text></g></svg>