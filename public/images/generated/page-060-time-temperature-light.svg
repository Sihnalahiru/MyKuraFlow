<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="45" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">WAREHOUSE ENVIRONMENT &amp; TIME</text><g font-family="Arial"><rect x="55" y="115" width="520" height="210" rx="18" fill="#fff" stroke="#0284c7" stroke-width="4"/><text x="85" y="165" font-size="29" font-weight="bold" fill="#075985">COLD STORAGE CAPACITY</text><text x="90" y="225" font-size="30" fill="#172554">Area × Effective height × 0.9 × 0.4</text><text x="90" y="275" font-size="30" fill="#172554">100 × 5 × 0.9 × 0.4 = 180 t</text><rect x="625" y="115" width="520" height="210" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="655" y="165" font-size="29" font-weight="bold" fill="#166534">STORAGE HUMIDITY</text><circle cx="885" cy="240" r="65" fill="#dcfce7" stroke="#15803d" stroke-width="5"/><text x="885" y="250" text-anchor="middle" font-size="30" fill="#166534">40–50%</text><rect x="55" y="370" width="330" height="190" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="220" y="420" text-anchor="middle" font-size="27" fill="#172554">12-HOUR</text><text x="220" y="470" text-anchor="middle" font-size="34" fill="#172554">11 PM = 11 PM</text><text x="220" y="520" text-anchor="middle" font-size="25" fill="#475569">AM / PM</text><rect x="435" y="370" width="330" height="190" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="600" y="420" text-anchor="middle" font-size="27" fill="#172554">24-HOUR</text><text x="600" y="470" text-anchor="middle" font-size="34" fill="#172554">23:00</text><text x="600" y="520" text-anchor="middle" font-size="25" fill="#475569">00:00 = midnight</text><rect x="815" y="370" width="330" height="190" rx="18" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="980" y="420" text-anchor="middle" font-size="27" fill="#92400e">LIGHT LEVEL</text><text x="980" y="480" text-anchor="middle" font-size="45" font-weight="bold" fill="#92400e">≥150 lx</text><text x="980" y="520" text-anchor="middle" font-size="23" fill="#475569">ordinary work standard</text></g></svg>