<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f8fafc"/><text x="50" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">FINAL WAREHOUSE COUNTERS</text><g font-family="Arial" font-size="27"><rect x="60" y="115" width="1080" height="330" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="110" y="180" fill="#1d4ed8">周 (shuu) — one circuit / round</text><text x="110" y="235" fill="#1d4ed8">面 (men) — surface / area</text><text x="110" y="290" fill="#1d4ed8">山 (yama) — heap / grouped quantity</text><text x="110" y="345" fill="#15803d">か所 (kasho) — locations</text><text x="620" y="180" fill="#15803d">回 / 度 — times / frequency</text><text x="620" y="235" fill="#15803d">巻 (maki) — rolls</text><text x="620" y="290" fill="#15803d">期 (ki) — period / phase</text><text x="620" y="365" fill="#475569">Use the counter that matches the item or activity.</text></g></svg>