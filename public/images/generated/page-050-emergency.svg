<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="55" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">EMERGENCY RESPONSE AT THE WAREHOUSE</text><g font-family="Arial"><rect x="55" y="110" width="345" height="520" rx="18" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="225" y="165" text-anchor="middle" font-size="30" font-weight="bold" fill="#1d4ed8">EARTHQUAKE</text><text x="90" y="235" font-size="25" fill="#334155">1. Move away from</text><text x="115" y="270" font-size="25" fill="#334155">falling cargo</text><text x="90" y="330" font-size="25" fill="#334155">2. Protect yourself</text><text x="90" y="390" font-size="25" fill="#334155">3. Evacuate after</text><text x="115" y="425" font-size="25" fill="#334155">shaking stops</text><text x="90" y="485" font-size="25" fill="#334155">4. Report safe status</text><rect x="425" y="110" width="345" height="520" rx="18" fill="#fff" stroke="#dc2626" stroke-width="4"/><text x="597" y="165" text-anchor="middle" font-size="30" font-weight="bold" fill="#b91c1c">FIRE</text><text x="460" y="235" font-size="25" fill="#334155">1. Shout warning</text><text x="460" y="300" font-size="25" fill="#334155">2. Extinguish only</text><text x="485" y="335" font-size="25" fill="#334155">if still small</text><text x="460" y="400" font-size="25" fill="#334155">3. Alarm → stop work</text><text x="485" y="435" font-size="25" fill="#334155">and evacuate</text><rect x="795" y="110" width="345" height="520" rx="18" fill="#fff" stroke="#0d9488" stroke-width="4"/><text x="967" y="165" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f766e">POWER FAILURE</text><text x="830" y="235" font-size="25" fill="#334155">1. Stay calm</text><text x="830" y="300" font-size="25" fill="#334155">2. Use portable or</text><text x="855" y="335" font-size="25" fill="#334155">forklift light</text><text x="830" y="400" font-size="25" fill="#334155">3. Move to exit</text><text x="830" y="465" font-size="25" fill="#334155">4. Open door manually</text></g></svg>