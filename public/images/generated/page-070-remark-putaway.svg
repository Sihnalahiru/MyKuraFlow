<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="36" font-weight="bold" fill="#172554">CARGO REMARK CODES &amp; SAFE PUT-AWAY</text><rect x="55" y="105" width="1090" height="360" rx="18" fill="#fff" stroke="#64748b" stroke-width="3"/><g font-family="Arial" font-size="24" fill="#334155"><text x="90" y="160" font-weight="bold" fill="#b91c1c">DENT</text><text x="260" y="160">Dented</text><text x="610" y="160" font-weight="bold" fill="#b91c1c">COVER TORN</text><text x="820" y="160">Packaging torn</text><text x="90" y="215" font-weight="bold" fill="#b91c1c">WET / RUSTY</text><text x="260" y="215">Wet / rusted</text><text x="610" y="215" font-weight="bold" fill="#b91c1c">BANDS OFF</text><text x="820" y="215">Band broken</text><text x="90" y="270" font-weight="bold" fill="#b91c1c">BROKEN / BURST</text><text x="300" y="270">Broken / burst</text><text x="610" y="270" font-weight="bold" fill="#b91c1c">CRUSHED</text><text x="820" y="270">Crushed</text><text x="90" y="325" font-weight="bold" fill="#b91c1c">DEFORM</text><text x="260" y="325">Deformed</text><text x="610" y="325" font-weight="bold" fill="#b91c1c">LEAKING</text><text x="820" y="325">Leaking</text><text x="90" y="405" fill="#1d4ed8">Mismatch / unreadable barcode → report to supervisor and follow instructions</text></g><rect x="55" y="500" width="1090" height="200" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="90" y="550" font-family="Arial" font-size="28" font-weight="bold" fill="#166534">PUT-AWAY RULES</text><text x="100" y="610" font-family="Arial" font-size="25" fill="#14532d">Suitable pallet • Secure with bands • Stack stably • Damaged goods separate</text><text x="100" y="655" font-family="Arial" font-size="25" fill="#14532d">Store at assigned alphanumeric location</text></svg>