<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="40" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">DISTRIBUTION PROCESSING TASKS</text><g font-family="Arial" font-size="24" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="40" y="130" width="250" height="190" rx="18"/><rect x="330" y="130" width="250" height="190" rx="18"/><rect x="620" y="130" width="250" height="190" rx="18"/><rect x="910" y="130" width="250" height="190" rx="18"/></g><g fill="#1e3a8a" font-weight="bold"><text x="165" y="180">TAGGING</text><text x="455" y="180">INSERTION</text><text x="745" y="180">CUT / REPACK</text><text x="1035" y="180">SET ASSEMBLY</text></g><g fill="#334155" font-size="20"><text x="165" y="235">Tag gun + price tag</text><text x="455" y="235">Manual / warranty</text><text x="745" y="235">Specified size / case</text><text x="1035" y="235">Group different items</text></g><path d="M165 260 l-30 25 h60z M455 260 l-30 25 h60z M745 260 l-30 25 h60z M1035 260 l-30 25 h60z" fill="#60a5fa"/><rect x="55" y="385" width="1090" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="435" fill="#166534" font-size="27" font-weight="bold">REPACKING HYGIENE</text><text x="600" y="485" fill="#14532d" font-size="23">Frozen goods: cold/cloth gloves + new vinyl gloves on top</text><text x="600" y="520" fill="#14532d" font-size="23">Fresh foods: remove work gloves and maintain hygiene</text></g></svg>