<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="45" y="60" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">PICKING METHODS &amp; PACKING</text><g font-family="Arial"><rect x="50" y="115" width="350" height="400" rx="18" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="225" y="165" text-anchor="middle" font-size="29" font-weight="bold" fill="#1d4ed8">SINGLE</text><text x="225" y="215" text-anchor="middle" font-size="23" fill="#334155">Order A → pick A</text><text x="225" y="260" text-anchor="middle" font-size="23" fill="#334155">Order B → pick B</text><text x="225" y="305" text-anchor="middle" font-size="23" fill="#334155">Order C → pick C</text><text x="225" y="390" text-anchor="middle" font-size="22" fill="#475569">Many walks</text><text x="225" y="430" text-anchor="middle" font-size="22" fill="#475569">Ready to ship</text><rect x="425" y="115" width="350" height="400" rx="18" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="600" y="165" text-anchor="middle" font-size="29" font-weight="bold" fill="#15803d">TOTAL / BATCH</text><text x="600" y="230" text-anchor="middle" font-size="23" fill="#334155">Collect all goods</text><path d="M500 260 H700" stroke="#16a34a" stroke-width="6"/><text x="600" y="315" text-anchor="middle" font-size="23" fill="#334155">Stage → sort by order</text><text x="600" y="390" text-anchor="middle" font-size="22" fill="#475569">Less travel</text><text x="600" y="430" text-anchor="middle" font-size="22" fill="#475569">Needs sorting space</text><rect x="800" y="115" width="350" height="400" rx="18" fill="#fff" stroke="#d97706" stroke-width="4"/><text x="975" y="165" text-anchor="middle" font-size="29" font-weight="bold" fill="#92400e">STICKER</text><text x="975" y="230" text-anchor="middle" font-size="23" fill="#334155">Prepare destination labels</text><text x="975" y="285" text-anchor="middle" font-size="23" fill="#334155">Pick → attach label</text><text x="975" y="340" text-anchor="middle" font-size="23" fill="#334155">Labels exhausted = done</text><text x="975" y="410" text-anchor="middle" font-size="22" fill="#475569">Pick + inspect together</text><rect x="50" y="550" width="1100" height="95" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="600" y="610" text-anchor="middle" font-size="28" fill="#075985">PACKING = protect cargo in cartons / bags for transport</text></g></svg>