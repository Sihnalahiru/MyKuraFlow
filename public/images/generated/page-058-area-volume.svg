<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><text x="55" y="65" font-family="Arial" font-size="38" font-weight="bold" fill="#172554">AREA, VOLUME &amp; CAPACITY</text><rect x="70" y="155" width="320" height="210" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/><text x="230" y="255" text-anchor="middle" font-family="Arial" font-size="32" fill="#1e3a8a">1 m × 1 m</text><text x="230" y="420" text-anchor="middle" font-family="Arial" font-size="30" fill="#172554">AREA = 1 m²</text><g transform="translate(500 150)"><path d="M0 70 L130 0 L290 65 L160 140 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/><path d="M0 70 V260 L160 335 V140 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/><path d="M160 140 V335 L290 265 V65 Z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="4"/></g><text x="645" y="535" text-anchor="middle" font-family="Arial" font-size="30" fill="#172554">VOLUME = 1 m³</text><rect x="900" y="180" width="210" height="210" fill="#dcfce7" stroke="#15803d" stroke-width="5"/><text x="1005" y="270" text-anchor="middle" font-family="Arial" font-size="28" fill="#166534">10 cm</text><text x="1005" y="310" text-anchor="middle" font-family="Arial" font-size="28" fill="#166534">CUBE</text><text x="1005" y="435" text-anchor="middle" font-family="Arial" font-size="30" fill="#166534">1 dm³ = 1 L</text><text x="60" y="600" font-family="Arial" font-size="24" fill="#334155">Area = length × width • Volume = area × height • Capacity = amount a container holds</text></svg>